# ~/.tmux.conf is a symlink to this file (created by setup.sh)
# Prefix is the default Ctrl-b. "prefix x" below means: press Ctrl-b, let go, then press x.

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set -g mouse on                 # click panes/windows, drag borders, scroll
set -g base-index 1             # windows start at 1 (easier to reach than 0)
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps after closing a window
set -g history-limit 50000
set -sg escape-time 10          # no lag when pressing Esc in neovim
set -g focus-events on          # lets neovim reload files changed outside it
set -g set-clipboard on         # copied text goes to the system clipboard

# True color, so neovim's theme looks the same inside tmux
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ',*:RGB'

# ---------------------------------------------------------------------------
# Shortcuts
# ---------------------------------------------------------------------------
# prefix r: reload this config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# prefix | / prefix -: split side by side / top and bottom, in the current folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix h/j/k/l: move between panes (same keys as neovim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + arrow keys: move between panes, no prefix needed
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# prefix H/J/K/L: resize pane (press again quickly to keep resizing, no prefix needed)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Shift + left/right: previous / next window, no prefix needed
bind -n S-Left previous-window
bind -n S-Right next-window

# Copy mode (prefix [): vim keys, v to select, y to copy, Esc to leave
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ---------------------------------------------------------------------------
# Appearance (Material Palenight, matches terminal-appearance.zsh)
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#292D3E,fg=#A6ACCD"
set -g status-left-length 30
set -g status-left "#[bg=#82AAFF,fg=#292D3E,bold] #S #[default] "
set -g status-right "#[fg=#676E95]%a %b %d #[fg=#A6ACCD]%H:%M "
setw -g window-status-format "#[fg=#676E95] #I:#W "
setw -g window-status-current-format "#[bg=#444267,fg=#C3E88D,bold] #I:#W#{?window_zoomed_flag, (zoom),} "
set -g pane-border-style "fg=#3A3F58"
set -g pane-active-border-style "fg=#82AAFF"
set -g message-style "bg=#444267,fg=#FFCB6B"
setw -g mode-style "bg=#444267,fg=#EEFFFF"
